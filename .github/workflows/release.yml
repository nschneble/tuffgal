name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version v$VERSION"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} matches package.json v$VERSION"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: check whether version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view tuffgal versions --json 2>/dev/null || echo "[]")
          # npm view returns a scalar string when only one version is published; normalize to array before index()
          if echo "$PUBLISHED" | jq -e --arg v "$VERSION" '(if type=="array" then . else [.] end) | index($v)' > /dev/null; then
            echo "tuffgal@$VERSION already on npm — skipping publish + gh-release"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "tuffgal@$VERSION not yet on npm — proceeding"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public --tag alpha
      - if: steps.check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
